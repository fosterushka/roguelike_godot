="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Склад и припасы видны рядом. HUD не перекрывает центр.</text><text x="700" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Янтарный — действие; состояние дублируется текстом.</text><text x="40" y="747" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Полевой инструмент, а не корпоративная таблица и не неоновый sci-fi.</text></svg>