3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></symbol><linearGradient id="hero-fade"><stop stop-color="#101615"/><stop offset=".5" stop-color="#101615" stop-opacity=".88"/><stop offset="1" stop-color="#101615" stop-opacity=".05"/></linearGradient><linearGradient id="stage" x2="1" y2="1"><stop stop-color="#29332A"/><stop offset="1" stop-color="#151D19"/></linearGradient></defs><rect x="0" y="0" width="1280" height="800" rx="4" fill="#101615"/><text x="40" y="58" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" font-weight="600" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Состояния, а не тупики</text><text x="40" y="87" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Каждое недоступное действие объясняет причину и путь дальше.</text><rect x="40.0" y="126" width="392.0" height="280" rx="6" fill="#19211F" stroke="#3F4C43" stroke-width="1"/><use href="#i-scrap" xlink:href="#i-scrap" x="60.0" y="148" width="28" height="28" fill="none" stroke="#DBB56A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="60.0" y="211" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Недостаточно ресурсов</text><text x="60.0" y="249" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Нужно 40 лома. Доступно 35.</text><text x="60.0" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Не хватает: 5 лома.</text><g data-go="03-armory" role="button" tabindex="0" aria-label="Вернуться к оружию" style="cursor:pointer"><rect x="60.0" y="343" width="352.0" height="36" rx="4" fill="#232E2A" stroke="#738177" stroke-width="1"/><text x="236.0" y="366.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#EEEBDD" text-anchor="middle" letter-spacing="0">Вернуться к оружию</text></g><rect x="444.0" y="126" width="392.0" height="280" rx="6" fill="#19211F" stroke="#3F4C43" stroke-width="1"/><use href="#i-box" xlink:href="#i-box" x="464.0" y="148" width="28" height="28" fill="none" stroke="#DBB56A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="464.0" y="211" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Груз заполнен</text><text x="464.0" y="249" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Занято 12 / 12 мест.</text><text x="464.0" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Освободите место перед переносом.</text><g data-go="17-raid-cargo" role="button" tabindex="0" aria-label="Открыть груз" style="cursor:pointer"><rect x="464.0" y="343" width="352.0" height="36" rx="4" fill="#232E2A" stroke="#738177" stroke-width="1"/><text x="640.0" y="366.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#EEEBDD" text-anchor="middle" letter-spacing="0">Открыть груз</text></g><rect x="848.0" y="126" width="392.0" height="280" rx="6" fill="#19211F" stroke="#3F4C43" stroke-width="1"/><use href="#i-warning" xlink:href="#i-warning" x="868.0" y="148" width="28" height="28" fill="none" stroke="#EB9181" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="868.0" y="211" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Не удалось сохранить</text><text x="868.0" y="249" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Изменения пока не записаны.</text><text x="868.0" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Не выходите до повторной попытки.</text><g data-go="" role="button" tabindex="0" aria-label="Повторить запись" style="cursor:pointer"><rect x="868.0" y="343" width="352.0" height="36" rx="4" fill="#232E2A" stroke="#738177" stroke-width="1"/><text x="1044.0" y="366.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#EEEBDD" text-anchor="middle" letter-spacing="0">Повторить запись</text></g><rect x="40" y="438" width="580" height="245" rx="6" fill="#19211F" stroke="#3F4C43" stroke-width="1"/><text x="60" y="468" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Пустой поиск</text><use href="#i-search" xlink:href="#i-search" x="60" y="502" width="26" height="26" fill="none" stroke="#8E998C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="521" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Ничего не найдено</text><text x="60" y="561" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Сбросьте фильтры или измените запрос.</text><g data-go="03-armory" role="button" tabindex="0" aria-label="Сбросить фильтры" style="cursor:pointer"><rect x="60" y="598" width="240" height="36" rx="4" fill="#232E2A" stroke="#738177" stroke-width="1"/><text x="180.0" y="621.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#EEEBDD" text-anchor="middle" letter-spacing="0">Сбросить фильтры</text></g><rect x="636" y="438" width="604" height="245" rx="6" fill="#19211F" stroke="#3F4C43" stroke-width="1"/><text x="656" y="468" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#EEEBDD" text-anchor="start" letter-spacing="0">Обратная связь</text><use href="#i-check" xlink:href="#i-check" x="656" y="500" width="20" height="20" fill="none" stroke="#A7BC91" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="516" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#A7BC91" text-anchor="start" letter-spacing="0">Покупка завершена · Лом +1 · −16 кр.</text><use href="#i-info" xlink:href="#i-info" x="656" y="552" width="20" height="20" fill="none" stroke="#93B9C5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="568" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#93B9C5" text-anchor="start" letter-spacing="0">Перенесён 1 ремкомплект · На склад: Отменить</text><use href="#i-clock" xlink:href="#i-clock" x="656" y="604" width="20" height="20" fill="none" stroke="#ABB4A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="620" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#ABB4A6" text-anchor="start" letter-spacing="0">Сохранение…</text></svg>