[preset.0]
name="macOS Offline"
platform="macOS"
runnable=true
dedicated_server=false
custom_features="offline"
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json"
exclude_filter="tests/*,tests/**/*,docs/*,docs/**/*,build/*,build/**/*,override.cfg"
export_path="build/iron-caravan-macos.zip"
script_export_mode=2

[preset.0.options]
application/bundle_identifier="com.ironcaravan.offline"
application/short_version="0.1.0"
application/version="0.1.0"
application/copyright=""
binary_format/architecture="universal"
application/export_angle=0
codesign/codesign=0
notarization/notarization=0
